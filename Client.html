<script>
const BRANDS=['COMPASSION WORLD','おもひで商店','Aozora Kitchen','FEBBRAIO','アートリエ','Kazu個人'];
const TYPES=['通常','イベント','料金改定','Kazu本人名義','攻めた投稿','緊急告知'];
const CHANNELS=['Instagram','Threads','X']; let state={},view='today';
document.addEventListener('DOMContentLoaded',()=>{fill('brand',BRANDS);fill('type',TYPES);document.getElementById('channels').innerHTML=CHANNELS.map((v,i)=>`<label><input type="checkbox" name="channels" value="${v}" ${i===0?'checked':''}>${v}</label>`).join('');const d=new Date(Date.now()+3600000);d.setMinutes(0,0,0);document.querySelector('[name=scheduledAt]').value=localDate(d);load();});
function fill(name,values){document.querySelector('[name='+name+']').innerHTML=values.map(v=>`<option>${esc(v)}</option>`).join('')}
function localDate(d){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function load(){google.script.run.withSuccessHandler(data=>{state=data;document.getElementById('mode').textContent=data.dryRun?'DRY RUN（実投稿なし）':'LIVE';renderHealth();render()}).withFailureHandler(fail).getDashboardData()}
function renderHealth(){const h=state.health;const parts=[[h.queueTrigger&&h.editTrigger,'自動処理 '+(h.queueTrigger&&h.editTrigger?'OK':'要設定')],[h.approverRestricted,'承認者 '+(h.approverRestricted?'制限済み':'未制限')],[state.dryRun||h.configuredConnections===h.totalConnections,'API設定 '+h.configuredConnections+'/'+h.totalConnections]];document.getElementById('health').innerHTML=parts.map(p=>`<span class="${p[0]?'':'warn'}">${esc(p[1])}</span>`).join('')}
function render(){['today','pending','tomorrow','materials'].forEach(k=>document.getElementById(k+'Count').textContent=(state[k]||[]).length);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const list=document.getElementById('list');const items=state[view]||[];list.innerHTML=items.length?items.map(view==='materials'?materialCard:postCard).join(''):'<div class="empty">該当する項目はありません</div>';document.getElementById('errors').innerHTML=(state.recentErrors||[]).length?'<b>最近のエラー</b><br>'+state.recentErrors.map(e=>`${esc(e.at)} ${esc(e.channel)}: ${esc(e.message)}`).join('<br>'):''}
function postCard(p){const actions=p.status==='承認待ち'?`<div class="actions"><button onclick="approve('${p.id}')">承認</button><button class="reject" onclick="rejectPost('${p.id}')">差戻し</button></div>`:'';return `<article class="post"><div class="meta"><b>${esc(p.scheduledAt.replace('T',' ').slice(0,16))}</b><br>${esc(p.brand)}<br><span class="pill">${esc(p.channel)}</span><span class="pill">${esc(p.approval)}</span><span class="pill">${esc(p.status)}</span></div><div class="body">${esc(p.body)}</div>${actions}</article>`}
function materialCard(m){return `<article class="post"><div class="meta"><b>${esc(m.due)}</b><br>${esc(m.brand)}<br><span class="pill">${esc(m.status)}</span></div><div><b>${esc(m.type)}</b><div class="body">${esc(m.request)}</div></div><div class="meta">${esc(m.owner)}</div></article>`}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){view=b.dataset.view;render()}});
document.getElementById('postForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);const input=Object.fromEntries(fd);input.channels=fd.getAll('channels');if(!input.channels.length){toast('投稿先を選択してください');return}google.script.run.withSuccessHandler(r=>{toast(`${r.count}件を${r.status}（${r.approvalLevel}）で追加しました`);e.target.body.value='';load()}).withFailureHandler(fail).createPost(input)});
function approve(id){google.script.run.withSuccessHandler(()=>{toast('承認しました');load()}).withFailureHandler(fail).approvePost(id)}
function rejectPost(id){const reason=prompt('差戻し理由');if(reason===null)return;google.script.run.withSuccessHandler(()=>{toast('差戻しました');load()}).withFailureHandler(fail).rejectPost(id,reason)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}function fail(e){toast(e.message||String(e))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
