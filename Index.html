<!doctype html>
<html lang="ja"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><?!= include_('Styles'); ?><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script></head>
<body>
  <header><div><p class="eyebrow">COMPASSION WORLD</p><h1>SNS CONTROL</h1></div><span id="mode" class="badge">接続中</span></header>
  <main>
    <section id="login" class="card connect"><p class="eyebrow dark">MOBILE LOGIN</p><h2>管理画面にログイン</h2><p>この画面はスマートフォン用の安全な接続先です。</p><form id="loginForm"><label>メールアドレス<input name="email" type="email" autocomplete="username" autocapitalize="none" required></label><label>パスワード<input id="password" name="password" type="password" autocomplete="current-password" required></label><label><input id="showPassword" type="checkbox" style="width:auto"> パスワードを表示</label><button id="loginButton" type="submit">ログイン</button></form><button id="resetPassword" class="textButton" type="button">パスワードを忘れた場合</button></section>
    <div id="app" hidden>
      <section class="sessionBar"><div><b id="currentUser"></b><span id="currentRole" class="pill"></span></div><button id="logout" class="subtle" type="button">ログアウト</button></section>
      <section id="health" class="health"></section>
      <section class="composer card"><h2>投稿を追加</h2><form id="postForm"><div class="grid"><label>ブランド<select name="brand" required></select></label><label>投稿種別<select name="type" required></select></label><fieldset><legend>投稿先</legend><div id="channels" class="checks"></div></fieldset><label>予約日時<input name="scheduledAt" type="datetime-local" required></label></div><label>投稿本文<textarea name="body" rows="5" required></textarea></label><label>画像URL<input name="imageUrl" type="url"></label><div class="formFoot"><span>すべての投稿に管理人の承認が必要です</span><button type="submit">承認待ちに追加</button></div></form></section>
      <nav><button class="tab active" data-view="today">今日 <b id="todayCount">0</b></button><button class="tab" data-view="pending">承認待ち <b id="pendingCount">0</b></button><button class="tab" data-view="tomorrow">明日 <b id="tomorrowCount">0</b></button><button class="tab" data-view="materials">素材 <b id="materialsCount">0</b></button></nav>
      <section id="list" class="list"></section><section id="errors" class="errors"></section>
    </div>
  </main><div id="toast"></div><?!= include_('Client'); ?>
</body></html>
